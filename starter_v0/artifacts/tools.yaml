# starter_v0 — tool declarations.
# Keep tool names stable across this file, tools/__init__.py, and eval datasets.
# Routing intent is encoded in each description below to reduce wrong_tool/
# wrong_arg_value failures during eval and live demo.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Dùng khi thiếu thông tin hoặc cần xác nhận trước hành động nhạy cảm. response_type=text để hỏi bổ sung; yes_no để xác nhận; choice khi có danh sách chọn."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy bài đăng gần đây CUA MỘT TÀI KHOẢN CỤ THỂ trên X/Twitter. Chỉ dùng khi đã biết screenname. Nếu user nêu tên người nổi tiếng, map sang handle quen thuộc (ví dụ: Sam Altman->sama, Elon Musk->elonmusk, Andrej Karpathy->karpathy)."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng THEO CHỦ ĐỀ/từ khóa trên X/Twitter, không gắn với 1 tài khoản cụ thể. Dùng search_type=Top khi user nói 'top', 'phổ biến', 'nổi bật'; dùng Latest cho tin mới nhất theo thời gian."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu web. Với yêu cầu 'tin tức/hôm nay/tuần này' dùng topic=news và đặt timeframe tương ứng (hôm nay->day, tuần này->week, tháng này->month, năm nay->year). Với tra cứu chung dùng topic=general."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Đọc nội dung từ URL cụ thể đã có sẵn trong yêu cầu. Không dùng để tìm kiếm web mới. Nếu user nói 'bài này' nhưng chưa có URL, hãy gọi clarify để xin link trước."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Chỉ dùng để trình bày lại dữ liệu đã thu thập (items) thành digest. Không dùng để truy xuất dữ liệu mới."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi văn bản ra kênh ngoài (Telegram). Boundary bắt buộc: chỉ gọi sau khi user đã xác nhận rõ ràng yes/no. Nếu chưa xác nhận, phải gọi clarify với response_type=yes_no trước."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong policy nội bộ của công ty để trả lời câu hỏi compliance, publish, privacy, citation, tool usage."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm paper trên arXiv theo từ khóa/chủ đề nghiên cứu."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Trích text từ 1 paper arXiv cụ thể (URL hoặc arXiv id) để đọc nội dung chi tiết."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
